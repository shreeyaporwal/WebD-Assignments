<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ABC College Admission 2026</title>
</head>
<body>

  <header style="background: blue; color: white; text-align: center;">
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <h2>Courses and Fees</h2>
    <p>Available Courses</p>

    <table border="1" cellspacing="0" cellpadding="6">
      <tr>
        <th>Course</th>
        <th>Seats</th>
        <th>Fees</th>
      </tr>
      <tr>
        <td>B.Tech CSE</td>
        <td>120</td>
        <td>&#8377;90,000</td>
      </tr>
      <tr>
        <td>BCA</td>
        <td>60</td>
        <td>&#8377;45,000</td>
      </tr>
    </table>

    <br>

    <form>
      <fieldset>
        <legend>Application Form</legend>
        
        <label for="name">Name:</label><br>
        <input type="text" id="name"><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email"><br><br>
        
        <label for="course-select">Course:</label><br>
        <select id="course-select">
          <option value="cse">B.Tech CSE</option>
          <option value="bca">BCA</option>
        </select><br><br>
        
        <label for="statement">Statement:</label><br>
        <textarea id="statement"></textarea><br><br>
        
        <input type="submit" value="Apply">
      </fieldset>
    </form>
  </main>

  <br>

  <footer style="background: blue; color: white; text-align: center;">
    <p>&copy; 2026 ABC College</p>
  </footer>

</body>
</html>
