<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<form action="submit.php" method="POST">
  <input type="text" name="fullname" placeholder="Full name" required><br><br>
  <input type="email" name="email" placeholder="you@college.edu" required><br><br>
  <input type="tel" name="mobile" placeholder="10-digit mobile" pattern="[0-9]{10}" title="Enter exactly 10 digits" required><br><br>
  <input type="password" name="password" placeholder="Min 6 characters" minlength="6" required><br><br>
  <input type="number" name="age" placeholder="Age (17)" min="1" max="30" required><br><br>
  <input type="submit" value="Register">
</form>
</body>
